# Exercise definitions for the PT verifier.
#
# The verifier confirms POSITION, not reps: for each exercise, every metric below has to sit inside
# its calibrated band continuously for at least min_position_s seconds. Getting into each position is
# the bar; doing the reps once there is on you.
#
# metrics: what to measure each frame. Three kinds:
#   angle:  joint angle at the middle joint, degrees (0-180), from [a, b, c] landmark names.
#   height: how far landmark `of` sits above landmark `above`, in torso lengths (shoulder-hip
#           distance on the same side). Positive = higher in the image.
#   tilt:   angle of the segment from -> to away from straight up, degrees. 0 = upright,
#           90 = horizontal (prone, bear), independent of which way you face.
# Landmark names are MediaPipe's without the side prefix (shoulder, elbow, wrist, hip, knee, ankle,
# heel, foot_index). The side is chosen per clip: the working side for per-side exercises, or the
# side nearest the camera for both-sides exercises.
#
# sides: both      one position check, on whichever side the camera sees.
#        per_side  the left and the right position each have to be held (Y/T/W per arm, split
#                  squat per leg).
# bands: [low, high] per metric, per side, filled in from calibration
#   (python -m ptverifier.calibrate report). null until calibrated.
# status: tbd exercises are listed for completeness and skipped by the verifier.
#
# Session plans (reps, holds) live in the project brief. The verifier doesn't check them.

version: 2
min_position_s: 5

sessions:
  PT-A: [wall_slides, serratus_pushup_plus, prone_y, prone_t, prone_w, bear_hold]
  PT-B: [glute_bridge, dead_bug, side_plank, hinge_or_goblet]
  Walk-A: [bulgarian_split_squat, rdl]

exercises:
  wall_slides:
    name: Wall slides
    view: side
    sides: both
    metrics:
      torso: {tilt: {from: hip, to: shoulder}}
      shoulder_flexion: {angle: [hip, shoulder, elbow]}
      elbow: {angle: [shoulder, elbow, wrist]}
    bands: null

  serratus_pushup_plus:
    name: Serratus wall push-up plus
    view: side
    sides: both
    metrics:
      torso: {tilt: {from: hip, to: shoulder}}
      shoulder_flexion: {angle: [hip, shoulder, elbow]}
      elbow: {angle: [shoulder, elbow, wrist]}
    bands: null

  prone_y:
    name: Prone Y
    view: side
    sides: per_side
    metrics:
      torso: {tilt: {from: hip, to: shoulder}}
      shoulder: {angle: [hip, shoulder, elbow]}
      elbow: {angle: [shoulder, elbow, wrist]}
      wrist_lift: {height: {of: wrist, above: shoulder}}
    bands: null

  prone_t:
    name: Prone T
    view: side
    sides: per_side
    metrics:
      torso: {tilt: {from: hip, to: shoulder}}
      shoulder: {angle: [hip, shoulder, elbow]}
      elbow: {angle: [shoulder, elbow, wrist]}
      wrist_lift: {height: {of: wrist, above: shoulder}}
    bands: null

  prone_w:
    name: Prone W
    view: side
    sides: per_side
    metrics:
      torso: {tilt: {from: hip, to: shoulder}}
      shoulder: {angle: [hip, shoulder, elbow]}
      elbow: {angle: [shoulder, elbow, wrist]}
      elbow_lift: {height: {of: elbow, above: shoulder}}
    bands: null

  bear_hold:
    name: Bear hold
    view: side
    sides: both
    metrics:
      torso: {tilt: {from: hip, to: shoulder}}
      hip: {angle: [shoulder, hip, knee]}
      knee: {angle: [hip, knee, ankle]}
    bands: null

  bulgarian_split_squat:
    name: Bulgarian split squat
    view: side
    sides: per_side       # side = the front (working) leg
    metrics:
      torso: {tilt: {from: hip, to: shoulder}}
      hip: {angle: [shoulder, hip, knee]}
      knee: {angle: [hip, knee, ankle]}
    bands: null

  rdl:
    name: Romanian deadlift
    view: side
    sides: both
    metrics:
      torso: {tilt: {from: hip, to: shoulder}}
      hip_hinge: {angle: [shoulder, hip, knee]}
      knee: {angle: [hip, knee, ankle]}
    bands: null

  glute_bridge: {name: Glute bridge, status: tbd}
  dead_bug: {name: Dead bug, status: tbd}
  side_plank: {name: Side plank (left emphasis), status: tbd}
  hinge_or_goblet: {name: Hip hinge or goblet squat, status: tbd}
